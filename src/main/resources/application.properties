spring.application.name=todos
spring.datasource.url = jdbc:mysql://localhost:3306/todos?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username = root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql = true
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/docs

spring.jwt.secret=
spring.jwt.expiration=900000